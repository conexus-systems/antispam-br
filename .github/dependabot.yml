# Dependabot — CONEXUS canon (weekly America/Sao_Paulo).
# Generated by dependabot-fleet. Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - javascript
    groups:
      vite-and-build:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "esbuild*"
      react-inertia:
        patterns:
          - "react*"
          - "@inertiajs/*"
          - "@tanstack/*"
      radix-and-ui:
        patterns:
          - "@radix-ui/*"
          - "class-variance-authority"
          - "clsx"
          - "tailwind*"

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
