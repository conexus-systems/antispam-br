name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Pacotes TS (normalizador, datasets, reputação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (vetores compartilhados)
        run: npm test
      - name: Vetores de dataset reproduzíveis
        run: npm run vectors:check

  android:
    name: Android (engine, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine — testes JVM (vetores + instalador + desempenho)
        run: ./gradlew --no-daemon :engine:test
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug + release (R8)
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/engine/build/reports/tests
            apps/android/app/build/reports/lint-results-debug.html

  ios:
    name: iOS (validação de sintaxe Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swiftc -parse
        run: |
          swiftc --version
          find apps/ios -name '*.swift' -print0 | xargs -0 -r swiftc -parse

  backend:
    name: API comunitária (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: antispam
          POSTGRES_PASSWORD: antispam-ci-only
          POSTGRES_DB: antispam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U antispam -d antispam"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://antispam:antispam-ci-only@localhost:5432/antispam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w @antispam-br/api
      - run: npm run test:api
      - name: Imagem Docker
        run: docker build -f services/api/Dockerfile -t antispam-api:ci .

  legacy-expo:
    name: Protótipo Expo (congelado)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/legacy-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/legacy-expo/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx jest --ci --silent

  data:
    name: Dados e regras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON válido + regras perigosas
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true })
              .flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            for (const f of walk('data').filter((f) => f.endsWith('.json'))) JSON.parse(fs.readFileSync(f, 'utf8'));
            for (const f of fs.readdirSync('data/rules').filter((f) => f.endsWith('.json'))) {
              const r = JSON.parse(fs.readFileSync('data/rules/' + f, 'utf8'));
              for (const rule of r.rules || []) {
                if (rule.match && rule.match.emergency && rule.suggested_action !== 'ALLOW') {
                  console.error('REGRA PERIGOSA:', f, rule.id); process.exit(1);
                }
                if (rule.suggested_action === 'BLOCK' && rule.match && rule.match.prefix && rule.match.prefix.length < 6) {
                  console.error('BLOCK por prefixo curto é proibido:', f, rule.id); process.exit(1);
                }
              }
            }
            console.log('OK: data/ validado');
          "

  security:
    name: Secrets, dependências e licenças
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Nenhuma chave privada de dataset versionada (exceto a chave de TESTE)
        run: |
          if git ls-files | grep -vE '^data/test-vectors/datasets/TEST_KEY.json$' | xargs grep -lE '"(private_key|secret_key)"' 2>/dev/null; then
            echo "::error::chave privada versionada"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Licenças (bloqueia GPL/AGPL/LGPL em dependências de produção)
        run: node scripts/check-licenses.ts @antispam-br/api
      - name: npm audit (produção, high+)
        run: npm audit --omit=dev --workspace @antispam-br/api --audit-level=high

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: [packages, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx --yes @cyclonedx/cyclonedx-npm --workspace @antispam-br/api --omit dev --output-file sbom-api.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-api.json
