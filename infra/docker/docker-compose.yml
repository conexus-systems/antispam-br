# AntiSpam BR — ambiente local (API + Postgres). Segredos abaixo são só de desenvolvimento.
# Uso: docker compose -f infra/docker/docker-compose.yml up --build
#      docker compose -f infra/docker/docker-compose.yml up -d postgres   (só o banco, p/ testes)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antispam
      POSTGRES_PASSWORD: antispam-dev-only
      POSTGRES_DB: antispam
    ports:
      # host 5544: evita conflito com postgres nativo na 5432 da máquina dev
      - "127.0.0.1:5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antispam -d antispam"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://antispam:antispam-dev-only@postgres:5432/antispam
      SERVER_SECRET: dev-only-server-secret-change-me-0123456789
      MODERATION_TOKENS: dev:dev-only-moderation-token-change-me-0123
      POW_BITS: 16
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # host 17887: evita conflito com portas do ambiente dev
      - "127.0.0.1:17887:8787"

volumes:
  pgdata:
