# AntiSpam BR — ambiente local (API + Postgres)
# Uso: docker compose -f infra/docker/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antispam
      POSTGRES_PASSWORD: antispam-dev-only
      POSTGRES_DB: antispam
    ports:
      # host 5544: evita conflito com postgres nativo na 5432 da máquina dev
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema aplicado no primeiro boot
      - ../../services/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antispam -d antispam"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      NODE_ENV: production
      # M8+: DATABASE_URL aponta p/ o service postgres (rede interna do compose)
      DATABASE_URL: postgresql://antispam:antispam-dev-only@postgres:5432/antispam
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # host 17887: evita conflito/segurança de portas do ambiente dev
      - "17887:8787"
    volumes:
      # portal Web servido pela API (apps/web montado em ../apps/web relativo ao cwd da api)
      - ../../apps/web:/app/apps/web:ro

volumes:
  pgdata:
